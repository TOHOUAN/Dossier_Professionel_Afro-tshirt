<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tests locaux panier V1</title>
</head>
<body>
    <h1>Tests locaux panier V1</h1>
    <p>À utiliser sur un serveur local avec un profil navigateur de test. Ces tests modifient temporairement la clé du panier, puis restaurent sa valeur initiale. Aucune donnée personnelle n’est utilisée.</p>
    <button type="button" id="run">Lancer les tests locaux</button>
    <pre id="results" role="status"></pre>
    <iframe title="Page testée" style="height:1600px;border:0"></iframe>
    <iframe title="Deuxième onglet simulé" style="height:500px;border:0"></iframe>
    <script src="panier-v1.js"></script>
</body>
